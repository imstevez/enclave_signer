[package]
name = "enclave_signer"
version = "0.2.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
axum = { version = "0.8.4", features = ["default"] }
tracing = { version = "0.1.41", features = ["default"] }
tracing-subscriber = "0.3.19"
anyhow = "1.0.99"
aws-config = "1.8.6"
aws-sdk-kms = { version = "1.81.0", features = ["default"] }
aws-nitro-enclaves-nsm-api = "0.4.0"
aws-smithy-types = "1.3.2"
rsa = { version = "0.9.8", features = ["sha2"] }
rand = { version = "0.8.5" }
serde_bytes = "0.11.19"
serde = { version = "1.0.219", features = ["derive"] }
uuid = { version = "1.17.0", features = ["v4"] }
hex = { version = "0.4.3" }
openssl = { version = "0.10.73", features = ["vendored"] }
aws-nitro-enclaves-cose = "0.5.2"
serde_cbor = { version = "0.11.2" }
ethers = { version = "2.0.14" }
aes-gcm = { version = "0.10.3", features = ["default"] }
eth_checksum = "0.1.2"
reqwest = { version = "0.12.23", features = ["json"] }
strum_macros = "0.27.2"
strum = "0.27.2"
solana-sdk = "3.0.0"
